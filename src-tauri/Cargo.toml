[package]
name = "auralflow"
version = "0.2.2"
description = "Dictado local y privado para macOS y Windows"
authors = ["AntonioJose81"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "auralflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
cpal = "0.18"
enigo = "0.6"
futures-util = "0.3"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = "0.16"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Enigo 0.6.1 llama a TISGetInputSourceProperty fuera del hilo principal en
# macOS y provoca EXC_BREAKPOINT con Tauri. Este commit aplica la corrección
# oficial de enigo-rs/enigo#510 hasta que se publique una versión estable.
[patch.crates-io]
enigo = { git = "https://github.com/enigo-rs/enigo", rev = "c041408b4f9f0b96bf2c10d79f782ede146b5634" }
